services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobicy
      POSTGRES_DB: jobicy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobicy -d jobicy"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
